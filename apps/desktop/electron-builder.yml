appId: vn.edu.neu.agent
productName: NEU Agent
copyright: NEU Agent
directories:
  output: release
  buildResources: build
# Mã đã được esbuild gộp vào dist/: gói cài chỉ chứa dist + package.json, đóng trong asar
files:
  - dist/**/*
  - package.json
  - "!dist/**/*.map"
# Gói mở rộng của tổ chức (thư mục packs/ ở gốc kho mã, xem docs/EXTENSIONS.md): đi kèm bản cài, đọc lúc chạy.
# Tổ chức khác chỉ cần thay nội dung thư mục packs/ — không đụng mã lõi.
extraResources:
  - from: ../../packs
    to: packs
    filter: ["**/*.md", "**/*.json", "**/*.txt", "**/*.csv", "!**/.*"]
asar: true
# Chỉ giữ gói ngôn ngữ của Chromium/macOS cho tiếng Việt và tiếng Anh (bỏ ~55 ngôn ngữ còn lại: nhẹ hơn ~8 MB mỗi bản cài)
electronLanguages: [vi, en-US]
compression: maximum
npmRebuild: false
nodeGypRebuild: false
buildDependenciesFromSource: false

# Củng cố Electron (fuses): tắt các đường tắt có thể bị lợi dụng để chạy mã tuỳ ý
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  loadBrowserProcessSpecificV8Snapshot: false
  grantFileProtocolExtraPrivileges: false

afterSign: scripts/after-sign.cjs

mac:
  category: public.app-category.education
  icon: build/icon.png
  # Chế độ ký do scripts/release.mjs quyết định theo chứng chỉ có sẵn (xem docs/RELEASE-SIGNING.md):
  #   có Developer ID + khoá notarize → ký + Hardened Runtime + notarize (tải về chạy ngay, không cảnh báo)
  #   không có → ký "ad-hoc" (-) để vẫn chạy được trên Apple Silicon, nhưng macOS sẽ cảnh báo lần đầu mở
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  gatekeeperAssess: false
  target:
    - { target: dmg, arch: [arm64, x64] }
    - { target: zip, arch: [arm64, x64] }
  artifactName: "NEU-Agent-${version}-mac-${arch}.${ext}"
  extendInfo:
    NSMicrophoneUsageDescription: ""
    NSCameraUsageDescription: ""
dmg:
  title: "NEU Agent ${version}"
  contents:
    - { x: 130, y: 220 }
    - { x: 410, y: 220, type: link, path: /Applications }

win:
  icon: build/icon.png
  # Bản không ký (scripts/release.mjs thêm signAndEditExecutable=false): đóng gói được từ macOS, .exe hiện "Nhà phát hành không xác định".
  # Bản ký số: dựng trên máy Windows/GitHub Actions (cần chứng chỉ code-signing), xem docs/RELEASE-SIGNING.md.
  # KHÔNG thêm target zip: ở compression=maximum nó mất ~16 phút trên máy Windows của Actions (cả bản dựng còn ~5 phút),
  # mà trình cập nhật chỉ dùng .exe (updater.ts chọn .exe trước .zip) và không tài liệu nào nhắc tới zip Windows.
  target:
    - { target: nsis, arch: [x64] }
  artifactName: "NEU-Agent-${version}-win-${arch}.${ext}"
# Gói MSIX cho Microsoft Store: dựng bằng scripts/store.mjs (workflow store.yml, máy Windows của GitHub). identityName/publisher/publisherDisplayName
# lấy từ Partner Center qua biến repo STORE_*, không ghi ở đây. Ảnh ô ở build/appx/. Store tự ký lại gói.
appx:
  applicationId: NEUAgent
  displayName: NEU Agent
  languages: [vi-VN, en-US]
  backgroundColor: "#0B1630"
  showNameOnTiles: true
  artifactName: "NEU-Agent-${version}-win-${arch}.${ext}"
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: NEU Agent
  deleteAppDataOnUninstall: false
  runAfterFinish: true
