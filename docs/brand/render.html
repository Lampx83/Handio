<!doctype html><meta charset="utf-8"><title>Dựng PNG biểu tượng Hando</title>
<body style="font:15px system-ui;padding:20px"><button id="go">Dựng PNG</button> <span id="st"></span>
<script>
// Vẽ từng SVG tĩnh vào canvas (đúng bộ lọc ánh sáng 3D của trình duyệt) rồi gửi PNG về máy chủ cục bộ.
const SIZES = [1024, 512, 256, 192, 128, 64, 32, 16];
async function run() {
  const st = document.getElementById("st");
  let n = 0;
  for (const style of ["2d", "3d"]) {
    const svg = await (await fetch(`hand-${style}-static.svg?t=${Date.now()}`, { cache: "no-store" })).text();
    const url = URL.createObjectURL(new Blob([svg], { type: "image/svg+xml" }));
    const img = new Image();
    img.src = url;
    await img.decode();
    for (const size of SIZES) {
      const c = document.createElement("canvas");
      c.width = c.height = size;
      const g = c.getContext("2d");
      g.imageSmoothingQuality = "high";
      g.drawImage(img, 0, 0, size, size);
      const blob = await new Promise((r) => c.toBlob(r, "image/png"));
      await fetch(`/save?name=app-icon-${style}-${size}.png`, { method: "POST", body: blob });
      st.textContent = `đã ghi ${++n}`;
    }
  }
  st.textContent = `xong: ${n} tệp`;
  document.title = "XONG";
}
document.getElementById("go").onclick = run;
if (location.hash === "#auto") run();
</script>
