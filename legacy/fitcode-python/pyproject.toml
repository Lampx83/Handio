[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "fitcode"
version = "0.1.0"
description = "FIT Code: agent lập trình trên terminal dùng mô hình Qwen của Khoa CNTT (NEU)"
requires-python = ">=3.8"
dependencies = []

[project.scripts]
fitcode = "fitcode.cli:main"

[tool.setuptools]
packages = ["fitcode"]
