# Đoạn dùng chung cho mọi location cần đăng nhập (SSO Microsoft 365 qua oauth2-proxy).
# Trình duyệt: cookie phiên. Ứng dụng Desktop: "Authorization: Bearer <id_token>" (oauth2-proxy tự kiểm chữ ký, đối tượng, hạn dùng).
auth_request /agent/oauth2/auth;
error_page 401 = @neu_signin;
auth_request_set $neu_email $upstream_http_x_auth_request_email;
