# NEU Agent (máy 220): máy chủ ảo cho ai.neu.edu.vn. Người dùng vào https://ai.neu.edu.vn/agent/ (HTTPS do máy 222 đảm nhiệm),
# máy 222 chuyển yêu cầu tới đây (cổng 80, Host: ai.neu.edu.vn). Cài vào /etc/nginx/sites-available/neu-agent.
server {
    listen 80;
    server_name ai.neu.edu.vn;

    # Chỉ nhận từ máy 222 (và chính máy này để tự kiểm tra). Ai gọi thẳng vào 220 bị từ chối.
    allow 192.0.2.22;
    allow 127.0.0.1;
    deny all;

    # IP thật của người dùng do 222 chuyển qua (để giới hạn tốc độ theo từng người)
    set_real_ip_from 192.0.2.22;
    real_ip_header   X-Forwarded-For;

    # Chuyển hướng dạng đường dẫn (/agent/...), KHÔNG tự thêm http://tên-miền: HTTPS do máy 222 giữ, trình duyệt ở lại https
    absolute_redirect off;

    include /etc/nginx/snippets/neu-agent-locations.conf;

    location / { return 404; }
}
