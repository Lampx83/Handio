# Sao lưu dữ liệu NEU Agent (backup/backup.py đọc tệp này). Đổi bằng: sudo ./backup/install-backup.sh --keep N | --remote … | --no-remote
# Số bản giữ trên máy (mỗi đêm một bản)
KEEP=14
# Đích ngoài máy qua rsync/SSH, dạng người_dùng@máy:thư/mục (để trống = không đẩy). Khoá SSH: /etc/neu-agent/backup-ssh-key
REMOTE=
REMOTE_PORT=22
