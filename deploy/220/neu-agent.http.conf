# NEU Agent (máy 220) — phần mức `http` của nginx. Cài vào /etc/nginx/conf.d/neu-agent.conf

# Chỉ máy 222 (mạng nội bộ hoặc IP công khai) và chính máy này được gọi vào ứng dụng.
# Dùng địa chỉ KẾT NỐI thật ($realip_remote_addr), KHÔNG dùng IP người dùng do 222 báo qua X-Forwarded-For
# (allow/deny của nginx chạy sau real_ip nên sẽ nhìn nhầm thành IP người dùng và chặn cả 222).
geo $realip_remote_addr $neu_from_front {
    default        0;
    127.0.0.1      1;
    @@SITE_222_INTERNAL_IP@@     1;
    @@SITE_222_PUBLIC_IP@@  1;
}

# Chống dò mật khẩu: chỉ POST (gửi form đăng nhập) mới tính vào hạn mức; GET xem trang không bị đếm (khoá rỗng = không giới hạn)
map $request_method $neu_login_key { POST $binary_remote_addr; default ""; }
limit_req_zone $neu_login_key zone=neu-login:10m rate=6r/m;
# Danh tính người dùng chuyển cho gateway/nhật ký: email (đăng nhập Microsoft) hoặc tên đăng nhập (tài khoản mật khẩu, không có email)
map $neu_email_h $neu_ident { default $neu_email_h; "" $neu_user_h; }
# Không nhận đăng nhập kiểu "Authorization: Basic" trên bất kỳ đường nào (chỉ form có giới hạn tốc độ ở trên)
map $http_authorization $neu_basic_blocked { ~*^basic 1; default 0; }

limit_req_zone  $binary_remote_addr zone=neu-agent:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=neu-agent_conn:10m;
limit_req_status 429;

# Key mô hình gắn ở PHÍA MÁY CHỦ: không nằm trong JavaScript gửi cho trình duyệt hay trong gói cài.
# Ai tự dán key riêng (Cài đặt) thì dùng key của họ (Kong theo dõi riêng từng người).
# Người dùng tự dán key riêng (Cài đặt) thì không tính vào hạn mức token của hệ thống (cổng hạn mức đọc tiêu đề X-Neu-Own-Key)
map $http_x_ollama_seckey $neu_own_key { default 1; "" 0; }
map $http_x_ollama_seckey $neu_agent_key {
    default $http_x_ollama_seckey;
    ""      "__NEU_AGENT_KEY__";
}

# Danh sách mô hình (/agent/vllm/v1/models): ưu tiên CỔNG HẠN MỨC (lọc theo quyền mô hình của bậc/nhóm, docs/QUOTA.md).
# Cổng chết/treo hoặc bản cũ chưa có đường này (404) thì nginx gọi thẳng Kong (backup): danh sách đầy đủ như trước.
# max_fails=0: không "đánh dấu chết" cổng sau một lần lỗi, mỗi yêu cầu đều thử cổng trước. Hai nơi cùng đường dẫn /vllm/v1/models.
upstream neu_agent_models {
    server 127.0.0.1:4191 max_fails=0;
    server @@SITE_GATEWAY_HOSTPORT@@ backup;
}

# ---------------------------------------------------------------- chẩn đoán: nhật ký truy cập JSON cho /agent/ (docs/DIAGNOSTICS.md)
# Chỉ ghi: thời điểm, mã trạng thái, phương thức, NHÓM đường dẫn (không ghi URL/query string), thời gian xử lý và dung lượng.
# KHÔNG ghi: query string, cookie, Authorization, email, IP, User-Agent. Báo cáo hằng ngày (deploy/220/diag/report.py) đọc tệp này.
map $uri $neu_route {
    default                                  other;
    ~^/agent/vllm/v1/chat/completions$       vllm_chat;
    ~^/agent/vllm/v1/models$                 vllm_models;
    /agent/diag                              diag;
    /agent/quota                             quota;
    /agent/healthz                           healthz;
    ~^/agent/oauth2/                         oauth;
    ~^/agent/download/.+\.(dmg|exe|zip|msi|deb|AppImage)$ download_pkg;   # tải bản cài (đếm trên trang quản trị)
    ~^/agent/download/                       download;
    ~^/agent/admin/                          admin;
    ~^/agent/                                ui;
}
log_format neu_agent_json escape=json
    '{"ts":"$time_iso8601","status":$status,"method":"$request_method","route":"$neu_route",'
    '"rt":$request_time,"urt":"$upstream_response_time","bytes":$body_bytes_sent}';
