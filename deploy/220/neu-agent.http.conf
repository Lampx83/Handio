# NEU Agent (máy 220) — phần mức `http` của nginx. Cài vào /etc/nginx/conf.d/neu-agent.conf

limit_req_zone  $binary_remote_addr zone=neu-agent:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=neu-agent_conn:10m;
limit_req_status 429;

# Key mô hình gắn ở PHÍA MÁY CHỦ: không nằm trong JavaScript gửi cho trình duyệt hay trong gói cài.
# Ai tự dán key riêng (Cài đặt) thì dùng key của họ (Kong theo dõi riêng từng người).
map $http_x_ollama_seckey $neu_agent_key {
    default $http_x_ollama_seckey;
    ""      "__NEU_AGENT_KEY__";
}

# ---------------------------------------------------------------- chẩn đoán: nhật ký truy cập JSON cho /agent/ (docs/DIAGNOSTICS.md)
# Chỉ ghi: thời điểm, mã trạng thái, phương thức, NHÓM đường dẫn (không ghi URL/query string), thời gian xử lý và dung lượng.
# KHÔNG ghi: query string, cookie, Authorization, email, IP, User-Agent. Báo cáo hằng ngày (deploy/220/diag/report.py) đọc tệp này.
map $uri $neu_route {
    default                                  other;
    ~^/agent/vllm/v1/chat/completions$       vllm_chat;
    ~^/agent/vllm/v1/models$                 vllm_models;
    /agent/diag                              diag;
    /agent/healthz                           healthz;
    ~^/agent/oauth2/                         oauth;
    ~^/agent/download/.+\.(dmg|exe|zip|msi|deb|AppImage)$ download_pkg;   # tải bản cài (đếm trên trang quản trị)
    ~^/agent/download/                       download;
    ~^/agent/admin/                          admin;
    ~^/agent/                                ui;
}
log_format neu_agent_json escape=json
    '{"ts":"$time_iso8601","status":$status,"method":"$request_method","route":"$neu_route",'
    '"rt":$request_time,"urt":"$upstream_response_time","bytes":$body_bytes_sent}';
