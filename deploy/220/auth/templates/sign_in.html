{{define "sign_in.html"}}
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Đăng nhập NEU Agent</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f3;--panel:#fff;--text:#1f2328;--muted:#6b7078;--border:#dedcd3;--accent:#0b4a9e;--err:#c0302b}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#1f2023;--text:#e8e6e1;--muted:#9a9ea6;--border:#34363b;--accent:#5b9bff}}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:min(380px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:32px 28px;display:grid;gap:14px}
h1{margin:0;text-align:center;color:var(--accent);font-size:26px}
button,input[type=submit]{width:100%;padding:11px 14px;border-radius:10px;border:1px solid var(--border);font:inherit;font-weight:600;cursor:pointer;background:var(--panel);color:var(--text)}
.primary{background:var(--accent);border-color:var(--accent);color:#fff}
input[type=text],input[type=password]{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--border);font:inherit;background:var(--bg);color:var(--text)}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);font-size:13px}.or:before,.or:after{content:"";flex:1;height:1px;background:var(--border)}
form{display:grid;gap:10px;margin:0}.note{text-align:center;color:var(--muted);font-size:12.5px;margin:0}
.guide{display:block;text-align:center;text-decoration:none;color:var(--accent);font-weight:600;border-top:1px solid var(--border);padding-top:14px}
</style>
</head>
<body>
<div class="card">
  <h1>NEU Agent</h1>
  <form method="GET" action="{{.ProxyPrefix}}/start">
    <input type="hidden" name="rd" value="{{if or (eq .Redirect "/") (eq .Redirect "")}}/agent/{{else}}{{.Redirect}}{{end}}">
    <button type="submit" class="primary">Đăng nhập Microsoft</button>
  </form>
  <p class="note">@neu.edu.vn · @st.neu.edu.vn</p>
  {{ if .CustomLogin }}
  <div class="or">hoặc</div>
  <form method="POST" action="{{.ProxyPrefix}}/sign_in" autocomplete="on">
    <input type="hidden" name="rd" value="{{if or (eq .Redirect "/") (eq .Redirect "")}}/agent/{{else}}{{.Redirect}}{{end}}">
    <input type="text" name="username" id="username" placeholder="Tên đăng nhập" autocomplete="username" required maxlength="64">
    <input type="password" name="password" id="password" placeholder="Mật khẩu" autocomplete="current-password" required maxlength="200">
    <input type="submit" value="Đăng nhập">
  </form>
  {{ end }}
  <a class="guide" href="/agent/guide/">Xem giới thiệu, ảnh và demo hệ thống</a>
</div>
</body>
</html>
{{end}}
