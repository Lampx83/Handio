{{define "error.html"}}
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{.StatusCode}} · Hando</title>
<style>
:root{color-scheme:light dark;--bg:#f6f6f3;--panel:#fff;--text:#1f2328;--muted:#6b7078;--border:#dedcd3;--accent:#0b4a9e}
@media (prefers-color-scheme:dark){:root{--bg:#17181a;--panel:#1f2023;--text:#e8e6e1;--muted:#9a9ea6;--border:#34363b;--accent:#5b9bff}}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--text);font:15px/1.5 -apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.card{width:min(420px,92vw);background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:28px;text-align:center}
h1{margin:0 0 8px;font-size:20px}p{color:var(--muted);margin:0 0 18px}a{display:inline-block;padding:10px 18px;border-radius:10px;background:var(--accent);color:#fff;text-decoration:none;font-weight:600}
</style>
</head>
<body>
<div class="card">
  <h1>{{if eq .StatusCode 403}}Không có quyền truy cập{{else}}Có lỗi xảy ra{{end}}</h1>
  <p>{{if eq .StatusCode 403}}Tài khoản này không thuộc nhóm được phép dùng Hando.{{else}}Vui lòng thử lại.{{end}}</p>
  <a href="{{.ProxyPrefix}}/sign_out?rd={{.ProxyPrefix}}/sign_in">Đăng nhập tài khoản khác</a>
</div>
</body>
</html>
{{end}}
