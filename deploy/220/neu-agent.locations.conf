# NEU Agent (máy 220): các location của ai.neu.edu.vn/agent/ — mọi thứ đều phải ĐĂNG NHẬP (SSO Microsoft 365), trừ chính các đường dẫn đăng nhập.
# Cài vào /etc/nginx/snippets/neu-agent-locations.conf (cùng thư mục có neu-agent-auth.conf).

# Nhật ký truy cập của máy chủ ảo này: CHỈ định dạng JSON không chứa query string/cookie/email (xem neu-agent.http.conf). Thay cho access.log chung.
access_log /var/log/nginx/neu-agent-access.json.log neu_agent_json;

# ---------------------------------------------------------------- đăng nhập (oauth2-proxy nghe ở 127.0.0.1:4180, tiền tố /agent/oauth2)
location = /agent/oauth2/auth {
    internal;
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_pass http://127.0.0.1:4180;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host ai.neu.edu.vn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Uri $request_uri;
}
# Đăng nhập bằng tên + mật khẩu: chỉ POST bị giới hạn (6 lần/phút/IP, tối đa 6 lần dồn) để chặn dò mật khẩu
location = /agent/oauth2/sign_in {
    limit_req zone=neu-login burst=6 nodelay;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host ai.neu.edu.vn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    add_header Cache-Control "no-store" always;
}
location /agent/oauth2/ {
    # phiên đăng nhập Microsoft 365 nằm trong cookie (id_token dài): phần đầu phản hồi có thể vượt 8 KB; mặc định nginx cắt và báo 502
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host ai.neu.edu.vn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;
}
# Chưa đăng nhập: trang web → trang chọn cách đăng nhập (Microsoft hoặc tên + mật khẩu); API → 401 JSON để ứng dụng tự xử lý
location @neu_signin { return 302 /agent/oauth2/sign_in?rd=$uri; }
location @neu_api401 {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"error":"login_required","message":"Cần đăng nhập"}';
}

# ---------------------------------------------------------------- giao diện
location = /agent { return 301 /agent/; }

# TRANG CHỦ /agent/: chưa đăng nhập → trang giới thiệu (cùng tệp với /agent/guide/) có nút đăng nhập; đã đăng nhập → vào thẳng ứng dụng.
# Chỉ riêng đường dẫn đúng "/agent/" được nới như vậy; mọi tệp khác của ứng dụng, API, tải về vẫn bắt buộc đăng nhập (không đổi).
location = /agent/ {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_landing;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;
    root /var/www/neu-agent/;
    try_files /index.html =404;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store";
}
location @neu_landing {
    root /var/www/neu-agent-guide/;
    rewrite ^ /index.html break;
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;
}

location /agent/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store";
}

# Gói đã băm tên: cache lâu (vẫn phải đăng nhập)
location /agent/chunks/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent/chunks/;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, max-age=31536000, immutable";
}

# Worker chạy mã do mô hình viết: CSP riêng, KHÔNG cho ra mạng (bắt buộc giữ nguyên header này)
location = /agent/sandbox-worker.js {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent/sandbox-worker.js;
    default_type application/javascript;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval'; connect-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store";
}

# Bản cài Desktop + SHA256SUMS.txt + hướng dẫn (ngoài thư mục web để cập nhật web không xoá chúng)
location ^~ /agent/download/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent-dl/;
    autoindex off;
    default_type application/octet-stream;
    charset utf-8;
    types { text/plain txt md; application/json json; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store";
    limit_conn neu-agent_conn 8;
}

# Trang giới thiệu + hướng dẫn CÔNG KHAI (ảnh, demo, nhật ký thay đổi) cho người chưa đăng nhập: tĩnh, không script, không auth_request.
# Chỉ phục vụ tệp trong /var/www/neu-agent-guide (tạo bởi install.sh từ deploy/220/guide-public); không có gì riêng tư ở đây.
location ^~ /agent/guide/ {
    alias /var/www/neu-agent-guide/;
    index index.html;
    autoindex off;
    charset utf-8;
    limit_except GET HEAD { deny all; }
    add_header Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "public, max-age=300";
    limit_conn neu-agent_conn 20;
}
location = /agent/guide { return 301 /agent/guide/; }

# ---------------------------------------------------------------- API mô hình: chỉ /models và /chat/completions
# /chat/completions đi qua CỔNG HẠN MỨC TOKEN (127.0.0.1:4191, deploy/220/quota): mỗi người một hạn mức/ngày, xem docs/QUOTA.md.
# Cổng chết (502/503/504) thì nginx tự chuyển thẳng tới Kong: người dùng vẫn dùng được, chỉ tạm không có hạn mức (healthz báo "quota").
location = /agent/vllm/v1/chat/completions {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    error_page 502 503 504 = @neu_chat_direct;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except POST { deny all; }
    limit_req  zone=neu-agent burst=100 nodelay;
    limit_conn neu-agent_conn 40;
    client_max_body_size 4m;

    proxy_pass http://127.0.0.1:4191/vllm/v1/chat/completions;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header x-ollama-seckey $neu_agent_key;
    proxy_set_header X-Neu-Own-Key $neu_own_key;
    proxy_set_header Authorization "";          # token đăng nhập KHÔNG được chuyển đi
    proxy_set_header Cookie "";
    proxy_set_header X-User-Email $neu_ident;   # danh tính do nginx gắn (máy khách không tự khai được)
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;            # streaming
    proxy_read_timeout 330;
    proxy_send_timeout 300;
    proxy_connect_timeout 2s;
}
location @neu_chat_direct {
    internal;
    rewrite ^ /vllm/v1/chat/completions break;      # trong location đặt tên proxy_pass không được kèm đường dẫn
    proxy_pass http://@@SITE_GATEWAY_HOSTPORT@@;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header x-ollama-seckey $neu_agent_key;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_connect_timeout 5s;
}

location = /agent/vllm/v1/models {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except GET { deny all; }
    limit_req  zone=neu-agent burst=100 nodelay;
    limit_conn neu-agent_conn 40;

    proxy_pass http://@@SITE_GATEWAY_HOSTPORT@@/vllm/v1/models;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header x-ollama-seckey $neu_agent_key;
    proxy_set_header Authorization "";          # token đăng nhập KHÔNG được chuyển sang gateway
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_read_timeout 60;
    proxy_connect_timeout 5s;
}

# Hạn mức token của chính người gọi (ứng dụng hiển thị mức đã dùng). Danh tính do nginx gắn.
location = /agent/quota {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except GET { deny all; }
    limit_req  zone=neu-agent burst=20 nodelay;

    proxy_pass http://127.0.0.1:4191/quota;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header X-Neu-Own-Key $neu_own_key;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    error_page 502 503 504 = @neu_quota_down;
}
location @neu_quota_down {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 200 '{"unlimited":true,"state":"unlimited","limit":0,"used":0,"unavailable":true}';
}
location /agent/vllm/ { return 404; }

# ---------------------------------------------------------------- công cụ web cho agent (deploy/220/tools; dịch vụ nghe 127.0.0.1:4192)
# Tìm web và tải một trang công khai để agent tra cứu (bản web không tự gọi ra Internet được). Phải đăng nhập; danh tính do nginx gắn.
# Dịch vụ tự chặn địa chỉ nội bộ (SSRF), giới hạn theo người dùng, và không ghi nội dung truy vấn. Chưa cài dịch vụ thì trả 503 JSON.
location ~ ^/agent/tools/(search|fetch)$ {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except GET { deny all; }
    limit_req  zone=neu-agent burst=10 nodelay;
    limit_conn neu-agent_conn 20;

    proxy_pass http://127.0.0.1:4192/tools/$1$is_args$args;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 45s;
    proxy_buffering on;
    error_page 502 503 504 = @neu_tools_down;
}
location @neu_tools_down {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"error":"Công cụ tìm web hiện chưa hoạt động. Hãy tiếp tục bằng những gì bạn đã có và nói rõ điều đó."}';
}
location /agent/tools/ { return 404; }

# ---------------------------------------------------------------- chẩn đoán & báo cáo (docs/DIAGNOSTICS.md; dịch vụ ở deploy/220/diag, nghe 127.0.0.1:4190)
# Ứng dụng gửi gói chẩn đoán KHÔNG chứa nội dung. Danh tính do bộ thu tự gắn từ X-User-Email (nginx ghi đè, máy khách không tự khai được).
location = /agent/diag {
    auth_request /agent/oauth2/auth;                       # như API mô hình: chưa đăng nhập => 401 JSON (không chuyển hướng)
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except POST { deny all; }
    limit_req  zone=neu-agent burst=20 nodelay;
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    proxy_pass http://127.0.0.1:4190/diag;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";                    # token/cookie đăng nhập KHÔNG chuyển sang bộ thu
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

# Góp ý / báo lỗi do NGƯỜI DÙNG tự viết và chủ động gửi (khác chẩn đoán: có nội dung). Lưu vào SQLite, chỉ quản trị viên xem ở /agent/admin/feedback.
location = /agent/feedback {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except POST { deny all; }
    limit_req  zone=neu-agent burst=5 nodelay;
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    proxy_pass http://127.0.0.1:4190/feedback;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
    error_page 502 503 504 = @neu_feedback_down;
}
location @neu_feedback_down {
    internal;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"ok":false,"error":"unavailable","message":"Chưa gửi được góp ý lúc này. Hãy thử lại sau ít phút."}';
}

# Chia sẻ cuộc trò chuyện: người dùng chủ động chia sẻ; người ĐÃ ĐĂNG NHẬP có liên kết đọc được (trang tĩnh, không script, CSP chặt).
# Bản chụp được lưu ở SQLite cho quản trị viên xem ở /agent/admin/shares (hộp chia sẻ nói rõ điều này cho người dùng).
location = /agent/share {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except POST { deny all; }
    limit_req  zone=neu-agent burst=5 nodelay;
    client_max_body_size 512k;

    proxy_pass http://127.0.0.1:4190/share;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    error_page 502 503 504 = @neu_feedback_down;
}
location = /agent/share/revoke {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except POST { deny all; }
    limit_req  zone=neu-agent burst=5 nodelay;
    client_max_body_size 2k;

    proxy_pass http://127.0.0.1:4190/share/revoke;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    error_page 502 503 504 = @neu_feedback_down;
}
location = /agent/shares {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except GET { deny all; }
    limit_req  zone=neu-agent burst=5 nodelay;
    client_max_body_size 1k;

    proxy_pass http://127.0.0.1:4190/shares;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    error_page 502 503 504 = @neu_feedback_down;
}
location ~ "^/agent/share/([A-Za-z0-9_-]{22})$" {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_signin;                           # trang người đọc: chưa đăng nhập thì chuyển tới đăng nhập rồi quay lại
    auth_request_set $neu_email_h $upstream_http_x_auth_request_email;
    auth_request_set $neu_user_h $upstream_http_x_auth_request_user;

    limit_except GET HEAD { deny all; }
    limit_req  zone=neu-agent burst=10 nodelay;

    proxy_pass http://127.0.0.1:4190/share/$1;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 15s;
    error_page 502 503 504 = @neu_feedback_down;
}

# Báo cáo chất lượng (tệp tĩnh do report.py tạo) CHỈ cho quản trị viên: nginx xác thực SSO rồi bộ thu đối chiếu email với /etc/neu-agent/admins.txt (403 nếu không có).
location ^~ /agent/admin/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    limit_except GET HEAD POST { deny all; }    # POST chỉ cho /agent/admin/api/accounts và /agent/admin/api/quota (collector tự kiểm tra quản trị viên + CSRF)
    client_max_body_size 2k;
    limit_req zone=neu-agent burst=20 nodelay;
    proxy_pass http://127.0.0.1:4190/admin/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_ident;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 45s;                      # đổi/xoá tài khoản khởi động lại dịch vụ đăng nhập (vài giây)
}

# Kiểm tra sống (KHÔNG cần đăng nhập, cho công cụ giám sát): chỉ trả {"ok":true|false}, không lộ chi tiết.
location = /agent/healthz {
    limit_except GET HEAD { deny all; }
    limit_req  zone=neu-agent burst=5 nodelay;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:4190/public-healthz;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    error_page 502 503 504 = @neu_health_down;
}
location @neu_health_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"ok":false}';
}
