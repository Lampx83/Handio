# NEU Agent (máy 220): các location của ai.neu.edu.vn/agent/ — mọi thứ đều phải ĐĂNG NHẬP (SSO Microsoft 365), trừ chính các đường dẫn đăng nhập.
# Cài vào /etc/nginx/snippets/neu-agent-locations.conf (cùng thư mục có neu-agent-auth.conf).

# Nhật ký truy cập của máy chủ ảo này: CHỈ định dạng JSON không chứa query string/cookie/email (xem neu-agent.http.conf). Thay cho access.log chung.
access_log /var/log/nginx/neu-agent-access.json.log neu_agent_json;

# ---------------------------------------------------------------- đăng nhập (oauth2-proxy nghe ở 127.0.0.1:4180, tiền tố /agent/oauth2)
location = /agent/oauth2/auth {
    internal;
    proxy_pass http://127.0.0.1:4180;
    proxy_pass_request_body off;
    proxy_set_header Content-Length "";
    proxy_set_header Host ai.neu.edu.vn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Forwarded-Uri $request_uri;
}
location /agent/oauth2/ {
    proxy_pass http://127.0.0.1:4180;
    proxy_set_header Host ai.neu.edu.vn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Auth-Request-Redirect $request_uri;
    proxy_hide_header X-Powered-By;
    add_header Cache-Control "no-store" always;
}
# Chưa đăng nhập: trang web → chuyển tới Microsoft; API → 401 JSON để ứng dụng tự xử lý
location @neu_signin { return 302 /agent/oauth2/start?rd=$uri; }
location @neu_api401 {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 401 '{"error":"login_required","message":"Cần đăng nhập"}';
}

# ---------------------------------------------------------------- giao diện
location = /agent { return 301 /agent/; }

location /agent/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store";
}

# Gói đã băm tên: cache lâu (vẫn phải đăng nhập)
location /agent/chunks/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent/chunks/;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, max-age=31536000, immutable";
}

# Worker chạy mã do mô hình viết: CSP riêng, KHÔNG cho ra mạng (bắt buộc giữ nguyên header này)
location = /agent/sandbox-worker.js {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent/sandbox-worker.js;
    default_type application/javascript;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval'; connect-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store";
}

# Bản cài Desktop + SHA256SUMS.txt + hướng dẫn (ngoài thư mục web để cập nhật web không xoá chúng)
location ^~ /agent/download/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    alias /var/www/neu-agent-dl/;
    autoindex off;
    default_type application/octet-stream;
    charset utf-8;
    types { text/plain txt md; application/json json; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-store";
    limit_conn neu-agent_conn 8;
}

# ---------------------------------------------------------------- API mô hình: chỉ /models và /chat/completions
location ~ ^/agent/vllm/v1/(models|chat/completions)$ {
    auth_request /agent/oauth2/auth;
    error_page 401 = @neu_api401;
    auth_request_set $neu_email $upstream_http_x_auth_request_email;

    limit_except GET POST { deny all; }
    limit_req  zone=neu-agent burst=100 nodelay;
    limit_conn neu-agent_conn 40;
    client_max_body_size 2m;

    proxy_pass http://192.0.2.10:8037/vllm/v1/$1;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header x-ollama-seckey $neu_agent_key;
    proxy_set_header Authorization "";          # token đăng nhập KHÔNG được chuyển sang gateway
    proxy_set_header X-User-Email $neu_email;   # để Kong/nhật ký biết ai gọi
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;            # streaming
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_connect_timeout 5s;
}
location /agent/vllm/ { return 404; }

# ---------------------------------------------------------------- chẩn đoán & báo cáo (docs/DIAGNOSTICS.md; dịch vụ ở deploy/220/diag, nghe 127.0.0.1:4190)
# Ứng dụng gửi gói chẩn đoán KHÔNG chứa nội dung. Danh tính do bộ thu tự gắn từ X-User-Email (nginx ghi đè, máy khách không tự khai được).
location = /agent/diag {
    auth_request /agent/oauth2/auth;                       # như API mô hình: chưa đăng nhập => 401 JSON (không chuyển hướng)
    error_page 401 = @neu_api401;
    auth_request_set $neu_email $upstream_http_x_auth_request_email;

    limit_except POST { deny all; }
    limit_req  zone=neu-agent burst=20 nodelay;
    client_max_body_size 16k;
    client_body_buffer_size 16k;

    proxy_pass http://127.0.0.1:4190/diag;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_email;
    proxy_set_header Authorization "";                    # token/cookie đăng nhập KHÔNG chuyển sang bộ thu
    proxy_set_header Cookie "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 10s;
}

# Báo cáo chất lượng (tệp tĩnh do report.py tạo) CHỈ cho quản trị viên: nginx xác thực SSO rồi bộ thu đối chiếu email với /etc/neu-agent/admins.txt (403 nếu không có).
location ^~ /agent/admin/ {
    include /etc/nginx/snippets/neu-agent-auth.conf;
    limit_except GET HEAD { deny all; }
    proxy_pass http://127.0.0.1:4190/admin/;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header X-User-Email $neu_email;
    proxy_set_header Authorization "";
    proxy_set_header Cookie "";
    proxy_read_timeout 10s;
}

# Kiểm tra sống (KHÔNG cần đăng nhập, cho công cụ giám sát): chỉ trả {"ok":true|false}, không lộ chi tiết.
location = /agent/healthz {
    limit_except GET HEAD { deny all; }
    limit_req  zone=neu-agent burst=5 nodelay;
    default_type application/json;
    add_header Cache-Control "no-store" always;
    proxy_pass http://127.0.0.1:4190/public-healthz;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Cookie "";
    proxy_set_header Authorization "";
    proxy_connect_timeout 2s;
    proxy_read_timeout 5s;
    error_page 502 503 504 = @neu_health_down;
}
location @neu_health_down {
    default_type application/json;
    add_header Cache-Control "no-store" always;
    return 503 '{"ok":false}';
}
