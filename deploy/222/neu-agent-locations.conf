# NEU Agent trên máy 222: toàn bộ ai.neu.edu.vn/agent/ chạy thật ở máy 220; 222 chỉ giữ tên miền và HTTPS rồi chuyển tiếp.
# Cài vào /etc/nginx/snippets/neu-agent-locations.conf (được `include` trong server block 443 của ai.neu.edu.vn).
location = /agent { return 301 /agent/; }

location /agent/ {
    proxy_pass http://192.0.2.21:80;          # không có đường dẫn sau cổng: giữ nguyên /agent/...
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host ai.neu.edu.vn;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;   # đặt đúng IP kết nối, KHÔNG tin X-Forwarded-For do client gửi
    proxy_set_header X-Forwarded-Proto https;
    proxy_redirect off;
    proxy_buffering off;                          # streaming từ mô hình, tải tệp lớn
    # cookie phiên đăng nhập Microsoft dài: nếu vùng đệm đầu phản hồi nhỏ, nginx báo 502 sau khi đăng nhập
    proxy_buffer_size 32k;
    proxy_buffers 8 32k;
    proxy_busy_buffers_size 64k;
    client_max_body_size 2m;
    proxy_connect_timeout 5s;
    proxy_read_timeout 300;
    proxy_send_timeout 300;
}
