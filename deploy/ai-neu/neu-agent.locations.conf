# NEU Agent (web) — các location trong server { } của ai.neu.edu.vn.
# Cài vào /etc/nginx/snippets/neu-agent-locations.conf và `include` ngay sau dòng server_name.
# Giao diện: tệp tĩnh ở /var/www/neu-agent. API: chuyển sang gateway nội bộ 232 (192.0.2.10:8037), chỉ 2 đường dẫn.

location = /agent { return 301 /agent/; }

location /agent/ {
    alias /var/www/neu-agent/;
    index index.html;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-cache";
}

# Gói đã băm tên: cache lâu
location /agent/chunks/ {
    alias /var/www/neu-agent/chunks/;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "public, max-age=31536000, immutable";
}

# Worker chạy mã do mô hình viết: CSP riêng, KHÔNG cho ra mạng (bắt buộc giữ nguyên header này)
location = /agent/sandbox-worker.js {
    alias /var/www/neu-agent/sandbox-worker.js;
    default_type application/javascript;
    add_header Content-Security-Policy "default-src 'none'; script-src 'unsafe-eval'; connect-src 'none'" always;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
}

# Bản cài Desktop (macOS/Windows) + SHA256SUMS.txt + hướng dẫn. Nằm NGOÀI thư mục web để cập nhật web không xoá chúng.
# Chỉ tệp tĩnh, không liệt kê thư mục; ^~ để các location regex khác không chen vào.
location ^~ /agent/download/ {
    alias /var/www/neu-agent-dl/;
    autoindex off;
    default_type application/octet-stream;
    charset utf-8;
    types { text/plain txt md; application/json json; }
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "no-cache";
    limit_conn neu-agent_conn 8;
}

# API mô hình: chỉ /models và /chat/completions
location ~ ^/agent/vllm/v1/(models|chat/completions)$ {
    limit_except GET POST { deny all; }
    limit_req  zone=neu-agent burst=100 nodelay;
    limit_conn neu-agent_conn 40;
    client_max_body_size 2m;

    proxy_pass http://192.0.2.10:8037/vllm/v1/$1;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header x-ollama-seckey $neu_agent_key;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_buffering off;            # streaming
    proxy_read_timeout 300;
    proxy_send_timeout 300;
    proxy_connect_timeout 5s;
}
location /agent/vllm/ { return 404; }
