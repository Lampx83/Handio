# NEU Agent (web) — phần mức `http` của nginx. Cài vào /etc/nginx/conf.d/neu-agent.conf
# (không khai báo lại `limit_req_status`: đã có 429 trong conf.d/kqxt-ratelimit.conf)

# Giới hạn theo IP thật. Rộng để không chặn nhầm cả phòng máy dùng chung IP; Kong vẫn giới hạn theo key.
limit_req_zone  $binary_remote_addr zone=neu-agent:10m rate=10r/s;
limit_conn_zone $binary_remote_addr zone=neu-agent_conn:10m;

# Key gắn ở PHÍA MÁY CHỦ: không nằm trong JavaScript gửi cho trình duyệt.
# Người dùng nào tự dán key riêng (Cài đặt) thì dùng key của họ (để Kong theo dõi riêng từng người).
map $http_x_ollama_seckey $neu_agent_key {
    default $http_x_ollama_seckey;
    ""      "__NEU_AGENT_KEY__";
}
