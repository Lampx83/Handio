# Phát hành NEU Agent Desktop: dựng, KÝ SỐ, notarize, kiểm tra chữ ký, tạo mã băm + bằng chứng nguồn gốc (provenance).
# Kích hoạt: tạo tag `v*` hoặc chạy tay (Actions → Release → Run workflow).
# Bí mật (Settings → Secrets and variables → Actions): xem docs/RELEASE-SIGNING.md. Thiếu bí mật thì bản dựng KHÔNG ký (và `require_signed` sẽ làm job thất bại).
# CHƯA được chạy thử trên GitHub: lần chạy đầu cần theo dõi và chỉnh theo thông báo lỗi.
name: Release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      require_signed:
        description: "Thất bại nếu không ký được (nên bật khi phát hành thật)"
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write      # cho attest-build-provenance
  attestations: write
env:
  NEU_DEFAULT_BASE_URL: https://ai.neu.edu.vn/agent/vllm/v1
  NEU_AUTH_TENANT: ${{ vars.NEU_AUTH_TENANT }}
  NEU_AUTH_CLIENT_ID: ${{ vars.NEU_AUTH_CLIENT_ID }}
  NEU_REQUIRE_SIGNED: ${{ (github.event_name == 'push' || inputs.require_signed) && '1' || '0' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:check          # mọi gói cùng phiên bản và CHANGELOG.md có mục cho phiên bản đó
      - name: Tag khớp phiên bản
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME không khớp phiên bản trong package.json"; exit 1; }
      - run: npm run typecheck
      - run: npx vitest run

  mac:
    needs: test
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Ghi khoá notarize (.p8) ra tệp tạm
        run: |
          echo "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "APPLE_API_KEY=$RUNNER_TEMP/AuthKey.p8" >> "$GITHUB_ENV"
        env: { APPLE_API_KEY_P8: "${{ secrets.APPLE_API_KEY_P8 }}" }
      - name: Dựng, ký, notarize, kiểm tra
        working-directory: apps/desktop
        run: node scripts/release.mjs --mac
        env:
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}                 # .p12 "Developer ID Application" (base64)
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "apps/desktop/release/*.dmg\napps/desktop/release/*.zip\napps/desktop/release/signing.json" }

  win:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Dựng, ký, kiểm tra
        working-directory: apps/desktop
        run: node scripts/release.mjs --win
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}             # .pfx (base64) — hoặc dùng dịch vụ ký đám mây của nhà cấp chứng chỉ, xem docs/RELEASE-SIGNING.md
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with: { name: win, path: "apps/desktop/release/*.exe\napps/desktop/release/*.zip\napps/desktop/release/signing.json" }

  publish:
    needs: [mac, win]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Mã băm
        run: |
          mkdir out && find dist -type f \( -name '*.dmg' -o -name '*.zip' -o -name '*.exe' \) -exec cp {} out/ \;
          cd out && sha256sum * > SHA256SUMS.txt && cat SHA256SUMS.txt
      - uses: actions/attest-build-provenance@v2
        with: { subject-path: "out/*" }                        # bằng chứng: tệp này do workflow này dựng từ commit này
      - uses: softprops/action-gh-release@v2
        with: { files: "out/*", draft: true }
