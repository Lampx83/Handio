# Phát hành NEU Agent Desktop: dựng (mac arm64/x64, Windows), KÝ SỐ nếu có chứng chỉ, kiểm tra chữ ký, tạo mã băm + latest.json
# (ghi chú lấy từ CHANGELOG.md), ĐƯA LÊN MÁY CHỦ để người dùng thấy "Có bản mới" và tải được, và tạo trang phát hành trên GitHub.
#
# Lưu ý biểu thức: với tag/workflow_call `inputs.publish_to_server` rỗng; `rỗng != false` trong GitHub Actions là FALSE (cả hai quy về 0), nên điều kiện
# so sánh CHUỖI (`format('{0}', …) != 'false'`: chỉ bỏ qua khi người chạy tay bỏ chọn) (lần phát hành 0.4.0/0.5.0 đầu tiên từng bỏ qua việc đưa lên máy chủ vì lỗi này).
# Kích hoạt:
#   - TỰ ĐỘNG: deploy.yml gọi workflow này sau khi triển khai web thành công mà phiên bản trong package.json CHƯA có tag (workflow_call);
#   - đẩy tag `v*` (quy trình phát hành tay: docs/RELEASE.md);
#   - chạy tay (Actions → Release → Run workflow; bỏ chọn "publish_to_server" để chỉ dựng thử).
# Chưa có chứng chỉ Apple Developer ID / Windows: bản dựng KHÔNG ký (người dùng thấy cảnh báo lần đầu mở; trang tải nói rõ). Khi đã có chứng chỉ,
# đặt biến repo RELEASE_REQUIRE_SIGNED=true để bản không ký bị CHẶN (xem docs/RELEASE-SIGNING.md).
name: Release
on:
  push:
    tags: ["v*"]
  workflow_call:
    inputs:
      tested:
        description: "CI đã xanh trong cùng lần chạy (deploy.yml): bỏ qua việc chạy lại typecheck + vitest"
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      require_signed:
        description: "Thất bại nếu không ký được (bật khi đã có chứng chỉ)"
        type: boolean
        default: false
      publish_to_server:
        description: "Đưa lên máy chủ 220 (bỏ chọn = chỉ dựng thử, tạo tệp tải về từ Actions)"
        type: boolean
        default: true
permissions:
  contents: write
  id-token: write      # cho attest-build-provenance
  attestations: write
env:
  NEU_DEFAULT_BASE_URL: https://ai.neu.edu.vn/agent/vllm/v1
  NEU_AUTH_TENANT: ${{ vars.NEU_AUTH_TENANT }}
  NEU_AUTH_CLIENT_ID: ${{ vars.NEU_AUTH_CLIENT_ID }}
  NEU_LAN_GATEWAY: ${{ vars.NEU_LAN_GATEWAY }}   # tuỳ chọn: http://địa-chỉ:cổng/vllm/v1 (lựa chọn "Mạng nội bộ" ở cài đặt)
  NEU_REQUIRE_SIGNED: ${{ (vars.RELEASE_REQUIRE_SIGNED == 'true' || inputs.require_signed == true) && '1' || '0' }}

jobs:
  config:
    name: Kiểm tra biến cấu hình bản phát hành
    runs-on: ubuntu-latest
    steps:
      - name: NEU_AUTH_TENANT / NEU_AUTH_CLIENT_ID phải là GUID (mã công khai không còn giữ giá trị mặc định)
        run: |
          for v in NEU_AUTH_TENANT NEU_AUTH_CLIENT_ID; do
            val="${!v:-}"
            echo "$val" | grep -Eq '^[0-9a-fA-F-]{36}$' || { echo "::error::Thiếu biến repo $v (GUID Entra). Đặt: gh variable set $v --body <GUID>  — xem docs/PUBLIC.md"; exit 1; }
          done
  test:
    if: ${{ inputs.tested != true }}     # gọi từ deploy.yml thì CI đã chạy đúng mã này rồi (tag/chạy tay vẫn kiểm thử)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:check          # mọi gói cùng phiên bản và CHANGELOG.md có mục cho phiên bản đó
      - name: Tag khớp phiên bản
        if: startsWith(github.ref, 'refs/tags/v')
        run: test "v$(node -p "require('./package.json').version")" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME không khớp phiên bản trong package.json"; exit 1; }
      - run: npm run typecheck
      - run: npx vitest run

  mac:
    needs: [config, test]
    if: ${{ !cancelled() && needs.config.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Đệm tệp tải của Electron/electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~/Library/Caches/electron
            ~/Library/Caches/electron-builder
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Dựng (ký + notarize nếu có chứng chỉ), kiểm tra
        working-directory: apps/desktop
        env:
          MAC_CSC_LINK: ${{ secrets.MAC_CSC_LINK }}                 # .p12 "Developer ID Application" (base64)
          MAC_CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID_S: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_S: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          # CHỈ đặt biến ký số khi có bí mật thật: electron-builder hiểu CSC_LINK rỗng là một đường dẫn tệp và báo lỗi "not a file"
          if [ -n "$MAC_CSC_LINK" ]; then export CSC_LINK="$MAC_CSC_LINK" CSC_KEY_PASSWORD="$MAC_CSC_KEY_PASSWORD"; fi
          if [ -n "$APPLE_API_KEY_P8" ] && [ -n "$APPLE_API_KEY_ID_S" ] && [ -n "$APPLE_API_ISSUER_S" ]; then
            printf '%s\n' "$APPLE_API_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
            export APPLE_API_KEY="$RUNNER_TEMP/AuthKey.p8" APPLE_API_KEY_ID="$APPLE_API_KEY_ID_S" APPLE_API_ISSUER="$APPLE_API_ISSUER_S"
          fi
          node scripts/release.mjs --mac
      - uses: actions/upload-artifact@v4
        with: { name: mac, path: "apps/desktop/release/*.dmg\napps/desktop/release/*.zip\napps/desktop/release/signing.json" }

  win:
    needs: [config, test]
    if: ${{ !cancelled() && needs.config.result == 'success' && (needs.test.result == 'success' || needs.test.result == 'skipped') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Đệm tệp tải của Electron/electron-builder
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: electron-${{ runner.os }}-
      - name: Dựng (ký nếu có chứng chỉ), kiểm tra
        working-directory: apps/desktop
        shell: bash
        env:
          WIN_CSC_LINK_S: ${{ secrets.WIN_CSC_LINK }}             # .pfx (base64) — hoặc dịch vụ ký đám mây của nhà cấp chứng chỉ, xem docs/RELEASE-SIGNING.md
          WIN_CSC_KEY_PASSWORD_S: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK_S" ]; then export WIN_CSC_LINK="$WIN_CSC_LINK_S" WIN_CSC_KEY_PASSWORD="$WIN_CSC_KEY_PASSWORD_S"; fi
          node scripts/release.mjs --win
      - uses: actions/upload-artifact@v4
        with: { name: win, path: "apps/desktop/release/*.exe\napps/desktop/release/signing.json" }

  publish:
    name: Gom, phát hành lên máy chủ và GitHub
    needs: [mac, win]
    # job `test` có thể bị bỏ qua (CI đã chạy ở deploy.yml): điều kiện ngầm success() coi tổ tiên bị bỏ qua là "không thành công" nên
    # phải nêu rõ — chỉ cần mac và win đều thành công
    if: ${{ !cancelled() && needs.mac.result == 'success' && needs.win.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: desktop-publish        # khác nhóm với deploy-production (nhóm của workflow gọi) để không tự chặn nhau
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Gom bản cài + latest.json (ghi chú từ CHANGELOG.md)
        id: pack
        run: |
          set -euo pipefail
          VER=$(node -p "require('./package.json').version")
          echo "version=$VER" >> "$GITHUB_OUTPUT"
          mkdir -p apps/desktop/release out pub
          cp dist/mac/*.dmg dist/mac/*.zip dist/win/*.exe apps/desktop/release/
          # signing.json của hai máy dựng gộp thành một (trang tải dựa vào đây để nói đúng: đã ký hay chưa)
          node -e 'const fs=require("fs");const m={};for(const f of ["dist/mac/signing.json","dist/win/signing.json"]){try{Object.assign(m,JSON.parse(fs.readFileSync(f,"utf8")))}catch{}}fs.writeFileSync("apps/desktop/release/signing.json",JSON.stringify(m,null,2))'
          # phiên bản tối thiểu còn được hỗ trợ: biến kho NEU_MIN_VERSION (Settings → Variables); bản cũ hơn bị yêu cầu cập nhật. Bỏ trống = không buộc.
          export NEU_MIN_VERSION="${{ vars.NEU_MIN_VERSION }}"
          # trang Microsoft Store (đặt SAU khi bài nộp đầu được duyệt và phát hành): hộp tải đưa người dùng Windows tới Store thay cho .exe
          export NEU_STORE_WIN_URL="${{ vars.NEU_STORE_WIN_URL }}"
          (cd apps/desktop && node scripts/release-info.mjs)
          cd apps/desktop/release
          cp NEU-Agent-"$VER"-*.dmg NEU-Agent-"$VER"-*.exe latest.json HUONG-DAN-CAI-DAT.md BAO-MAT.md ../../../pub/
          cp NEU-Agent-"$VER"-*.dmg NEU-Agent-"$VER"-*.exe NEU-Agent-"$VER"-*.zip SBOM.cdx.json ../../../out/ 2>/dev/null || true
          cd ../../../pub
          # trang tải chỉ cần .dmg/.exe: latest.json chỉ khai đúng các tệp đó
          python3 - <<'PY'
          import json
          j = json.load(open("latest.json", encoding="utf-8"))
          j["files"] = {k: v for k, v in j["files"].items() if k.endswith((".dmg", ".exe"))}
          json.dump(j, open("latest.json", "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          PY
          sha256sum NEU-Agent-* > SHA256SUMS.txt
          printf 'commit=%s\nrun=%s\nactor=%s\nversion=%s\ntime=%s\n' "$GITHUB_SHA" "$GITHUB_RUN_ID" "$GITHUB_ACTOR" "$VER" "$(date -u +%FT%TZ)" > MANIFEST
          cat SHA256SUMS.txt; echo; python3 -c 'import json;j=json.load(open("latest.json"));print("signed:",j.get("signed"),"| ghi chú:",len(j.get("notes","")),"ký tự")'
          # nhật ký thay đổi của phiên bản này, dạng Markdown, cho trang phát hành GitHub
          cd ../
          node -e 'import("./scripts/version.mjs").then(m=>{const fs=require("fs");const r=m.parseChangelog(fs.readFileSync("CHANGELOG.md","utf8")).releases.find(x=>x.version===process.argv[1]);fs.writeFileSync("release-notes.md",(r?r.body:"(chưa ghi nhật ký)")+"\n\n---\nTải về và cách kiểm tra mã băm: https://ai.neu.edu.vn/agent/ (nút Tải ứng dụng). Bản chưa ký số: macOS/Windows cảnh báo lần đầu mở, xem docs/RELEASE-SIGNING.md.")})' "$VER"
          sed -n 1,12p release-notes.md
      - uses: actions/attest-build-provenance@v2
        continue-on-error: true                        # chỉ có khi repo công khai hoặc gói trả phí; thiếu thì bỏ qua
        with: { subject-path: "pub/NEU-Agent-*" }      # bằng chứng: tệp này do workflow này dựng từ commit này
      - name: Tệp dựng (tải từ Actions nếu chỉ dựng thử)
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ steps.pack.outputs.version }}
          path: pub/
          retention-days: 30

      - name: Thiết lập SSH
        if: ${{ format('{0}', inputs.publish_to_server) != 'false' && vars.DEPLOY_ENABLED == 'true' }}
        uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          user: ${{ vars.DEPLOY_USER || 'neu-deploy' }}
      - name: Đưa lên máy chủ 220 (người dùng thấy "Có bản mới" và tải được)
        id: server
        if: ${{ format('{0}', inputs.publish_to_server) != 'false' && vars.DEPLOY_ENABLED == 'true' }}
        run: |
          set -euo pipefail
          tar -C pub --owner=0 --group=0 --numeric-owner -czf desktop.tgz .
          SHA=$(sha256sum desktop.tgz | cut -d' ' -f1)
          echo "Gói bản cài: $(du -h desktop.tgz | cut -f1), SHA-256 $SHA"
          # shellcheck disable=SC2029  # cố ý: $SHA mở rộng phía máy khách, máy chủ nhận đúng "publish-desktop <sha>"
          ssh neu220 "publish-desktop $SHA" < desktop.tgz | tee publish.log
          grep -q "^PUBLISHED_DESKTOP " publish.log
      - name: Trang phát hành GitHub (kèm nhật ký thay đổi)
        env:
          GH_TOKEN: ${{ github.token }}
          VER: ${{ steps.pack.outputs.version }}
        run: |
          set -uo pipefail
          # chỉ tạo khi máy chủ đã nhận (hoặc chạy thử không đưa lên máy chủ thì tạo bản nháp)
          draft=""; [ "${{ steps.server.outcome }}" = "success" ] || draft="--draft"
          release() {
            set -e
            if gh release view "v$VER" >/dev/null 2>&1; then
              gh release upload "v$VER" out/* --clobber
              gh release edit "v$VER" --notes-file release-notes.md
              # bản nháp tạo từ lần chạy trước (chưa đưa lên được máy chủ): đã đưa lên máy chủ thành công thì công bố luôn
              [ -n "$draft" ] || gh release edit "v$VER" --draft=false --latest
            else
              gh release create "v$VER" out/* --target "$GITHUB_SHA" --title "NEU Agent $VER" --notes-file release-notes.md $draft
            fi
          }
          # Trang phát hành GitHub chỉ là bản lưu: người dùng cập nhật từ MÁY CHỦ (bước trước). Nếu bước này lỗi (đã gặp 403 "Resource not accessible
          # by integration" với 0.8.5 dù quyền hợp lệ) thì cảnh báo to nhưng KHÔNG làm cả lần phát hành thành "thất bại".
          if ! release; then
            echo "::warning::Không tạo được trang phát hành GitHub v$VER (máy chủ đã nhận bản cài: ${{ steps.server.outcome }}). Tạo tay: gh release create v$VER --target $GITHUB_SHA --notes-file release-notes.md (tệp trong artifact desktop-$VER)."
          fi
      - name: Tóm tắt
        if: always()
        run: |
          {
            echo "### Phát hành Desktop ${{ steps.pack.outputs.version }}"
            echo "Đưa lên máy chủ: **${{ steps.server.outcome || 'bỏ qua' }}**"
            echo '```'; cat pub/SHA256SUMS.txt 2>/dev/null; echo '```'
            echo '```'; tail -n 5 publish.log 2>/dev/null || true; echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
