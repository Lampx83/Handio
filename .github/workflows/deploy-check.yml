# Kiểm tra KẾT NỐI triển khai mà KHÔNG triển khai gì: GitHub → máy 220 (SSH khoá hạn chế) → in bản đang chạy.
# Dùng sau khi thiết lập CI/CD hoặc khi nghi ngờ tường lửa/khoá (Actions → Deploy check → Run workflow). Xem docs/CICD.md.
name: Deploy check
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Kết nối tới máy 220
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
      DEPLOY_USER: ${{ vars.DEPLOY_USER || 'neu-deploy' }}
      SITE: ${{ vars.DEPLOY_SITE_URL || 'https://ai.neu.edu.vn' }}
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/ssh-setup
        with:
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          known_hosts: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          host: ${{ secrets.DEPLOY_HOST || vars.DEPLOY_HOST }}
          port: ${{ secrets.DEPLOY_PORT || vars.DEPLOY_PORT }}
          user: ${{ vars.DEPLOY_USER || 'neu-deploy' }}
      - name: Hỏi máy chủ đang chạy bản nào
        run: |
          ssh neu220 status < /dev/null | tee status.log
          # script triển khai trên máy chủ phải đủ mới để nhận bản cài Desktop; cũ thì chạy lại ci/setup-ci.sh (sudo, một lần)
          grep -q "Desktop đang phát hành" status.log || { echo "::error::Script neu-agent-deploy trên máy chủ đã cũ (thiếu publish-desktop). Chạy lại: sudo ./ci/setup-ci.sh --pubkey <khoá> (xem docs/CICD.md)."; exit 1; }
      - name: Kiểm tra site thật
        run: |
          hz=$(curl -s --max-time 15 "$SITE/agent/healthz" || true); echo "healthz: $hz"
          [ "$hz" = '{"ok":true}' ]
