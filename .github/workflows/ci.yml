# CI: chạy MỌI bộ kiểm thử cho mọi pull request. Không dùng bí mật nào (an toàn với PR từ nhánh/fork).
# Mỗi lần vào main do deploy.yml gọi lại (workflow_call) rồi chỉ triển khai khi CI xanh — KHÔNG có trigger `push` ở đây,
# nếu không mỗi lần vào main chạy CI hai lần (một lần ở đây, một lần trong Deploy).
name: CI
on:
  pull_request:
  workflow_call:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  node:
    name: Mã nguồn (kiểu, kiểm thử, dựng web)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run version:check          # mọi gói cùng phiên bản và CHANGELOG.md có mục cho phiên bản đó
      - name: Không có thông tin hạ tầng/định danh/bí mật trong kho (chuẩn bị công khai)
        run: node scripts/public-audit.mjs
      - run: npm run typecheck
      - run: npx vitest run
      - name: Dựng bản web (bản phát hành)
        run: NODE_ENV=production npm run build -w @neu/agent-web

  changelog:
    name: Nhật ký thay đổi (PR đổi mã người dùng thấy phải ghi CHANGELOG.md)
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Kiểm tra
        env:
          BASE: origin/${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          changed=$(git diff --name-only "$BASE"...HEAD)
          echo "$changed"
          # mã mà người dùng thấy (giao diện, lõi, ứng dụng), không tính thư mục kiểm thử
          if echo "$changed" | grep -E '^(packages|apps)/' | grep -vE '/(test|tests)/|\.test\.' | grep -q .; then
            if echo ",$LABELS," | grep -q ',khong-changelog,'; then echo "Có nhãn khong-changelog: bỏ qua."; exit 0; fi
            echo "$changed" | grep -qx 'CHANGELOG.md' || { echo "::error::PR đổi mã trong packages/ hoặc apps/ nhưng CHANGELOG.md chưa ghi gì. Ghi vào mục [Chưa phát hành] (Thêm/Thay đổi/Sửa), hoặc gắn nhãn khong-changelog nếu người dùng không thấy khác biệt."; exit 1; }
          fi
          echo "Đạt."

  python:
    name: "Máy chủ (Python — chẩn đoán, quản lý tài khoản)"
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Kiểm thử
        working-directory: deploy/220/diag
        run: python3 -W ignore -m unittest discover -s . -p 'test_*.py'
      - name: Kiểm thử sao lưu dữ liệu (gpg có sẵn; cài thêm age để thử cả hai)
        working-directory: deploy/220/backup
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq age >/dev/null || echo "::warning::không cài được age: bỏ qua bài age"
          python3 -W ignore -m unittest discover -s . -p 'test_*.py'

  shell:
    name: Script triển khai (cú pháp + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: bash -n mọi script
        run: |
          set -e
          find deploy -type f \( -name '*.sh' -o -name 'neu-agent-deploy' \) -print0 | xargs -0 -n1 bash -n
      - name: shellcheck (chỉ lỗi nghiêm trọng)
        run: |
          find deploy -type f \( -name '*.sh' -o -name 'neu-agent-deploy' \) -print0 | xargs -0 shellcheck --severity=error --shell=bash

  e2e:
    name: "Thử nginx + SSO + cài đặt + triển khai (Docker): ${{ matrix.name }}"
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      fail-fast: false            # các bài độc lập, chạy song song: thời gian = bài chậm nhất thay vì cộng dồn
      matrix:
        include:
          - { name: "đăng nhập SSO (nginx thật + oauth2-proxy thật + máy chủ OIDC giả)", script: e2e-sso.mjs }
          - { name: "script cài đặt 220/222 (nginx thật, có kiểm tra tự khôi phục)", script: e2e-install.mjs }
          - { name: "máy chủ nhận bản triển khai (khoá SSH hạn chế, gói xấu, rollback)", script: e2e-deploy.mjs }
          - { name: "sao lưu dữ liệu 220 (systemd thật, age, rsync/SSH chỉ-ghi, khôi phục)", script: e2e-backup.mjs }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Kéo ảnh Docker dùng cho bài thử
        run: |
          docker pull nginx:1.24
          docker pull quay.io/oauth2-proxy/oauth2-proxy:v7.15.5
          docker pull ubuntu:24.04
      - name: Chạy bài thử
        run: node deploy/test/${{ matrix.script }}

  # Container Docker của tab Code (packages/env-node/src/docker.ts) trên Linux THẬT: docker-real.test.ts không được tự bỏ qua ở đây.
  # Chỉ chạy cho PR (deploy.yml gọi lại ci.yml khi vào main: job này bỏ qua, không làm chậm/chặn triển khai máy chủ).
  container-linux:
    name: "Container Docker thật (Linux)"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"   # không cần Electron cho bài này
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - name: Kéo ảnh mặc định (lấy đúng tên trong mã)
        run: |
          set -euo pipefail
          img=$(grep -oP 'DEFAULT_CONTAINER_IMAGE = "\K[^"]+' packages/core/src/container.ts)
          echo "Ảnh: $img"
          docker pull "$img"
          docker image ls "$img"
      - name: Người dùng runner, Docker, quyền thư mục tạm
        run: |
          id
          docker version --format 'Docker {{.Server.Version}} {{.Server.Os}}/{{.Server.Arch}}'
          docker info --format 'Rootless/bảo mật: {{.SecurityOptions}}'
          d=$(mktemp -d); ls -ld "$d"; rmdir "$d"
      - name: Chạy docker-real.test.ts với Docker thật (thiếu Docker/ảnh thì đỏ; có cả bài cần mạng)
        env:
          HANDIO_REQUIRE_DOCKER: "1"
          HANDIO_DOCKER_NET: "1"
        run: npx vitest run packages/env-node/test/docker-real.test.ts --reporter=verbose --reporter=json --outputFile=docker-real.json
      - name: Kiểm số bài đã chạy (không bài nào bị bỏ qua)
        run: |
          node -e '
            const r = require("./docker-real.json");
            console.log(`Đạt ${r.numPassedTests}/${r.numTotalTests} · lỗi ${r.numFailedTests} · bỏ qua ${r.numPendingTests + r.numTodoTests}`);
            if (r.numFailedTests || r.numPendingTests || r.numTodoTests || r.numPassedTests < 14) process.exit(1);
          '
      - name: Không để lại container/volume
        if: always()
        run: |
          docker ps -a --filter label=handio.sandbox=1 --format '{{.Names}}'
          docker volume ls --filter label=handio.cache=1 --format '{{.Name}}'

  # Windows: thường không có Docker chạy container Linux trên runner, nên chỉ chạy bài docker giả + đường dẫn ổ đĩa (C:\…).
  container-windows:
    name: "Container: docker giả + đường dẫn Windows"
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npx vitest run packages/env-node/test/docker.test.ts --reporter=verbose
